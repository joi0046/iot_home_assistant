services:
  mqtt:
    image: eclipse-mosquitto:latest
    container_name: iot_mqtt
    restart: unless-stopped

    ports:
      - "1883:1883"

    volumes:
      - ../services/mqtt/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: iot_homeassistant
    restart: unless-stopped

    ports:
      - "8123:8123"

    volumes:
      - ../services/homeassistant:/config

    environment:
      - TZ=Asia/Tokyo

  gateway:
    build:
      context: ../app/gateway
      dockerfile: Dockerfile

    container_name: iot_gateway
    restart: unless-stopped

    env_file:
      - ../.env

    devices:
      - /dev/i2c-1:/dev/i2c-1

    depends_on:
      - mqtt

  influxdb:
    image: influxdb:2
    container_name: iot_influxdb
    restart: unless-stopped

    ports:
      - "8086:8086"

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}

    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

  telegraf:
    image: telegraf:latest
    container_name: iot_telegraf
    restart: unless-stopped

    depends_on:
      - mqtt
      - influxdb

    environment:
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}

    volumes:
      - ../services/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    image: grafana/grafana:latest
    container_name: iot_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  influxdb_data:
  influxdb_config:
  grafana_data:
