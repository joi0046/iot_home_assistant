[agent]
  interval = "2s"
  flush_interval = "2s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mqtt:1883"]
  topics = ["gateway/v1/readings"]
  qos = 0

  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "readings"
    timestamp_path = "timestamp"
    timestamp_format = "rfc3339"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device.id"
      rename = "device_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device.type"
      rename = "device_type"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.temperature.value"
      rename = "temperature"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.humidity.value"
      rename = "humidity"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.pressure.value"
      rename = "pressure"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.illuminance.value"
      rename = "illuminance"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.co2.value"
      rename = "co2"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.voltage.value"
      rename = "voltage"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.current.value"
      rename = "current"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.power.value"
      rename = "power"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.acceleration_x.value"
      rename = "acceleration_x"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.acceleration_y.value"
      rename = "acceleration_y"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.acceleration_z.value"
      rename = "acceleration_z"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.gyroscope_x.value"
      rename = "gyroscope_x"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.gyroscope_y.value"
      rename = "gyroscope_y"
      optional = true

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "data.gyroscope_z.value"
      rename = "gyroscope_z"
      optional = true

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
